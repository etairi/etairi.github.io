<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}page-home{{ else }}page-{{ .Kind }}{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" class="wrap">
    {{- block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
