      author = {Diego Castejon-Molina and Erkan Tairi and Dimitrios Vasilopoulos and Pedro Moreno-Sanchez},
      title = {Foundations of Verifiably Encrypted (Blind) Signatures},
      howpublished = {Cryptology {ePrint} Archive, Paper 2026/789},
      year = {2026},
      url = {https://eprint.iacr.org/2026/789}
    }
