      author = "Sch{\"a}dlich, Robert and Scheu-Hachtel, Linda and Tairi, Erkan and Wang, Yuejun",
      editor = "Galdi, Clemente and Siniscalchi, Luisa",
      title = "Ciphertext-Updatable Attribute-Based and Predicate Encryption from Lattices",
      booktitle = "Security and Cryptography for Networks",
      year = "2027",
