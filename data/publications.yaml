- id: a2l
  title: "A2L: Anonymous Atomic Locks for Scalability in Payment Channel Hubs"
  authors: [Erkan Tairi, Pedro Moreno-Sanchez, Matteo Maffei]
  year: 2021
  venue: IEEE S&P 2021
  eprint: 2019/589
  doi: 10.1109/SP40001.2021.00111
  code: https://github.com/etairi/A2L
  slides: /slides/a2l-oakland.pdf
  video: https://www.youtube.com/watch?v=RPj8efQteyg
  abstract: |
    Payment channel hubs (PCHs) constitute a promising solution to the inherent scalability problems of blockchain technologies, allowing for off-chain payments between sender and receiver through an intermediary, called the tumbler. While state-of-the-art PCHs provide security and privacy guarantees against a malicious tumbler, they do so by relying on the scripting-based functionality available only at few cryptocurrencies, and they thus fall short of fundamental properties such as backwards compatibility and efficiency.

    In this work, we present the first PCH protocol to achieve all aforementioned properties. Our PCH builds upon A2L, a novel cryptographic primitive that realizes a three-party protocol for conditional transactions, where the tumbler pays the receiver only if the latter solves a cryptographic challenge with the help of the sender, which implies the sender has paid the tumbler. We prove the security and privacy guarantees of A2L (which carry over to our PCH construction) in the Universal Composability framework and present a provably secure instantiation based on adaptor signatures and randomizable puzzles. We implemented A2L and compared it to TumbleBit, the state-of-the-art Bitcoin-compatible PCH. Asymptotically, A2L has a communication complexity that is constant, as opposed to linear in the security parameter like in TumbleBit. In practice, A2L requires ∼33x less bandwidth than TumbleBit, while retaining the computational cost (or providing 2x speedup with a preprocessing technique). This demonstrates that A2L (and thus our PCH construction) is ready to be deployed today.

    In theory, we demonstrate for the first time that it is possible to design a secure and privacy-preserving PCH while requiring only digital signatures and timelock functionality from the underlying scripting language. In practice, this result makes our PCH backwards compatible with virtually all cryptocurrencies available today, even those offering a highly restricted form of scripting language such as Ripple or Stellar. The practical appealing of our construction has resulted in a proof-of-concept implementation in the COMIT Network, a blockchain technology focused on cross-currency payments.
  bibtex: |
    @inproceedings{SP:TaiMorMaf21,
      author    = {Erkan Tairi and Pedro Moreno{-}Sanchez and Matteo Maffei},
      title     = {A\({}^{\mbox{2}}\)L: Anonymous Atomic Locks for Scalability in Payment
                   Channel Hubs},
      booktitle = {42nd {IEEE} Symposium on Security and Privacy, {SP} 2021, San Francisco,
                   CA, USA, 24-27 May 2021},
      pages     = {1834--1851},
      publisher = {{IEEE}},
      year      = {2021},
      url       = {https://doi.org/10.1109/SP40001.2021.00111},
      doi       = {10.1109/SP40001.2021.00111}
    }

- id: updatable-signatures
  title: "Updatable Signatures and Message Authentication Codes"
  authors: [Valerio Cini, Sebastian Ramacher, Daniel Slamanig, Christoph Striecks, Erkan Tairi]
  year: 2021
  venue: PKC 2021
  eprint: 2021/365
  doi: 10.1007/978-3-030-75245-3_25
  slides: /slides/us-pkc.pdf
  video: https://www.youtube.com/watch?v=RqAlXixDZ1M
  abstract: |
    Cryptographic objects with updating capabilities have been proposed by Bellare, Goldreich and Goldwasser (CRYPTO'94) under the umbrella of incremental cryptography. They have recently seen increased interest, motivated by theoretical questions (Ananth et al., EC'17) as well as concrete practical motivations (Lehmann et al., EC'18; Groth et al. CRYPTO'18; Klooss et al., EC'19). In this work, the form of updatability we are particularly interested in is that primitives are key-updatable and allow to update old cryptographic objects, e.g., signatures or message authentication codes, from the old key to the updated key at the same time without requiring full access to the new key (i.e., only via a so-called update token).

    Inspired by the rigorous study of updatable encryption by Lehmann and Tackmann (EC'18) and Boyd et al. (CRYPTO'20), we introduce a definitional framework for updatable signatures (USs) and message authentication codes (UMACs). We discuss several applications demonstrating that such primitives can be useful in practical applications, especially around key rotation in various domains, as well as serve as building blocks in other cryptographic schemes. We then turn to constructions and our focus there is on ones that are secure and practically efficient. In particular, we provide generic constructions from key-homomorphic primitives (signatures and PRFs) as well as direct constructions. This allows us to instantiate these primitives from various assumptions such as DDH or CDH (latter in bilinear groups), or the (R)LWE and the SIS assumptions. As an example, we obtain highly practical US schemes from BLS signatures or UMAC schemes from the Naor-Pinkas-Reingold PRF.
  bibtex: |
    @inproceedings{PKC:CRSST21,
      author    = {Valerio Cini and Sebastian Ramacher and Daniel Slamanig and Christoph Striecks and Erkan Tairi},
      editor    = {Juan A. Garay},
      title     = {Updatable Signatures and Message Authentication Codes},
      booktitle = {Public-Key Cryptography - {PKC} 2021 - 24th {IACR} International Conference
