      author = {Samed Düzlü and Nihar Gargava and Erkan Tairi},
      title = {Gaussian Kernel Lattices and Smoothing Bounds from Theta Integrals},
      howpublished = {Cryptology {ePrint} Archive, Paper 2026/2180},
