    @inproceedings{PKC:AAFKT26,
      author = "Abusalah, Hamza and Azari, Karen and Fiore, Dario and Kamath, Chethan and Tairi, Erkan",
      editor = "Bai, Shi and Persichetti, Edoardo",
      title = "On Verifiable Delay Functions from Time-Lock Puzzles",
      booktitle = "Public-Key Cryptography -- PKC 2026",
      year = "2026",
      publisher = "Springer Nature Switzerland",
