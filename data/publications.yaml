- id: mlwe-general-distributions
  title: "Hardness of M-LWE with General Distributions and Applications to Leaky Variants"
  authors: [Katharina Boudgoust, Corentin Jeudy, Erkan Tairi, Weiqiang Wen]
  year: 2026
  venue: PKC 2026
  eprint: 2025/1472
  doi: 10.1007/978-3-032-26731-3_1
  abstract: |
    The Module Learning With Errors (M-LWE) problem has become a fundamental hardness assumption for lattice-based cryptography. It offers an attractive trade-off between strong robustness guarantees, sometimes directly based on worst-case lattice problems, and efficiency of the subsequent cryptographic primitives. Different flavors of M-LWE have then been introduced towards improving performance. Such variants look at different secret-error distributions and might allow for additional hints on the secret-error vector. Existing hardness results however only cover restricted classes of said distributions, or are tailored to specific leakage models. This lack of generality hinders the design of efficient and versatile cryptographic schemes, as each new distribution or leakage model requires a separate and nontrivial hardness evaluation.

    In this work, we address this limitation by establishing the hardness of MLWE under general distributions. As a first step, we show that MLWE remains hard when the error vector follows an arbitrary bounded distribution with sufficient entropy, with some restriction on the number of samples. Building on this, we then reduce to the Hermite Normal Form (HNF) where the secret-error vector follows said arbitrary distribution. Overall, our result shows the actual shape of the distribution does not matter, as long as it keeps sufficient entropy.

    To demonstrate the versatility of our framework, we further analyze a range of leakage scenarios. By examining the residual entropy given the leakage, we show that our results of M-LWE with general distributions encompass various types of leakage. More precisely, we cover exact and approximate linear hints which are widely used in recent cryptographic designs, as well as quadratic, and even non-algebraic forms, some of which were not yet covered by any theoretical hardness guarantees. The generality of our results aims at facilitating future cryptographic designs and security analyses.
  bibtex: |
    @inproceedings{PKC:BJTW26,
      author = "Boudgoust, Katharina and Jeudy, Corentin and Tairi, Erkan and Wen, Weiqiang",
      editor = "Bai, Shi and Persichetti, Edoardo",
      title = "Hardness of M-LWE with General Distributions and Applications to Leaky Variants",
      booktitle = "Public-Key Cryptography -- PKC 2026",
      year = "2026",
      publisher = "Springer Nature Switzerland",
      address = "Cham",
      pages = "3--37",
      isbn = "978-3-032-26731-3"
    }

- id: vdf-from-tlp
  title: "On Verifiable Delay Functions from Time-Lock Puzzles"
  authors: [Hamza Abusalah, Karen Azari, Dario Fiore, Chethan Kamath, Erkan Tairi]
  year: 2026
  venue: PKC 2026
  eprint: 2025/1782
  doi: 10.1007/978-3-032-26740-5_16
  abstract: |
    A verifiable delay function (VDF) [Boneh et al., CRYPTO 2018] is a function that is slow-to-compute, but is quickly verifiable given a short proof. This is formalised using two security requirements: i) sequentiality, which requires that a parallel adversary is unable to compute faster; and ii) soundness, which requires that an adversary is unable to generate a proof that verifies wrong outputs. A time-lock puzzle (TLP), on the other hand, is a puzzle that can be quickly generated, but is slow-to-solve. The security requirement here is sequentiality, which requires that a parallel adversary is unable to solve puzzles faster.

    In this paper, we study the relationship between these two timed primitives. Our main result is a construction of one-time VDF from TLP using indistinguishability obfuscation (iO) and one-way functions (OWFs), where by one-time we mean that sequentiality of the VDF holds only against parallel adversaries that do not preprocess public parameters. Our VDF satisfies several desirable properties. For instance, we achieve perfectly sound and short proofs of O(λ) bits, where λ is the security parameter. Moreover, our construction is a trapdoor (one-time) VDF that can be easily extended to achieve interesting extra properties (defined in our paper) such as trapdoor-homomorphic and trapdoor-constrained evaluation.

    Finally, when combined with the results of Bitansky et al., [ITCS 2016], this yields one-time VDFs from any worst-case non-parallelizing language, iO and OWF. To the best of our knowledge, this is the first such construction that only relies on polynomial security.
