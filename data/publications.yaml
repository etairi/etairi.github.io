      editor = "Heninger, Nadia and Rosulek, Mike",
      title = "{LeOPaRd}: Towards Practical Post-quantum Oblivious {PRFs} via {2HashDH} Paradigm",
      booktitle = "Advances in Cryptology -- CRYPTO 2026",
      year = "2026",
      publisher = "Springer Nature Switzerland",
